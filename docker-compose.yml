# Nilai ${VITE_*} dibaca otomatis dari file .env di folder ini.
services:
  # Production build: docker compose up -d --build  →  http://localhost:8080
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev server + hot reload: docker compose --profile dev up dev  →  http://localhost:5173
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Supaya file watcher jalan di bind mount macOS/Windows.
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules:
